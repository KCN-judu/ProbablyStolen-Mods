name: Deploy documentation

# Builds the site from the collection's own pages and the doc/ folder of every mod, and
# publishes it to GitHub Pages. Each mod submodule is moved to the tip of its main branch
# first, so the site shows the latest documentation of every mod without a pointer bump.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A mod repository may trigger a rebuild after merging documentation:
  #   gh api repos/KCN-judu/ProbablyStolen-Mods/dispatches -f event_type=docs-updated
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use the latest documentation of every mod
        run: git submodule update --remote --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Check documentation
        run: npm run check
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
